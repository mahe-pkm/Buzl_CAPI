<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Landing Page</title>
</head>
<body>
  <h1>
Book Your Free Demo</h1>
  <form id="contactForm" method="post" action="/submit">
    <input type="text" name="bizName" placeholder="Business Name" required>
    <input type="tel" name="bizPhone" placeholder="Phone Number" required>
    <input type="text" name="bizLocation" placeholder="Location">
    <button type="submit">Submit Details</button>
  </form>
</body>
</html>
